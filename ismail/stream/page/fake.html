<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice chat</title>
<style>
  :root { --bg: #111318; --fg: #e8e8ea; --dim: #8b8f98; --me: #7cc4ff; --ev: #ffcf6e; --line: #232631; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f6f8; --fg: #16181d; --dim: #646a75; --me: #0b63b6;
    --ev: #9a5b00; --line: #dfe1e6; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  #lines { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .l { padding: 3px 0; word-wrap: break-word; }
  .u { font-weight: 600; margin-right: 6px; }
  .said .u { color: var(--me); }
  .event { color: var(--ev); font-style: italic; }
  .t { color: var(--dim); font-size: 12px; margin-right: 6px; }
  form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  input { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent;
    color: var(--fg); min-width: 0; }
  #user { width: 8em; }
  #text { flex: 1; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 0; background: var(--me); color: #fff; }
</style>
</head>
<body>
<header>Practice chat: type as a viewer. The streamer's replies show in blue.</header>
<div id="lines"></div>
<form id="f">
  <input id="user" placeholder="your name" value="viewer" maxlength="25" aria-label="Your name">
  <input id="text" placeholder="say something" maxlength="500" autocomplete="off" aria-label="Message">
  <button>Send</button>
</form>
<script>
let since = 0;
const box = document.getElementById('lines');
function add(d) {
  if (d.kind === 'said' && d.ok === false) return;      // refused: a real site would never show it
  const div = document.createElement('div');
  div.className = 'l ' + d.kind;
  const t = document.createElement('span');
  t.className = 't'; t.textContent = (d.ts || '').slice(11, 16);
  const u = document.createElement('span');
  u.className = 'u';
  u.textContent = d.kind === 'said' ? 'streamer' : ((d.user || {}).display || (d.user || {}).name || '?');
  const x = document.createElement('span');
  x.textContent = d.kind === 'event' ? `${d.type}${d.text ? ': ' + d.text : ''}` : (d.text || '');
  div.append(t, u, x);
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.append(div);
  if (atEnd) box.scrollTop = box.scrollHeight;
}
async function poll() {
  for (;;) {
    try {
      const r = await fetch(`/fake/lines?since=${since}&wait=${since ? 20 : 0}`);
      const j = await r.json();
      j.lines.forEach(add);
      since = j.lines.length ? j.lines[j.lines.length - 1].n : Math.max(since, j.last);
    } catch (e) { await new Promise(r => setTimeout(r, 2000)); }
  }
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('text');
  if (!text.value.trim()) return;
  await fetch('/fake/say', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user: document.getElementById('user').value, text: text.value})});
  text.value = '';
});
poll();
</script>
</body>
</html>
