<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback</title>
<style>
  :root { --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --soft: #66645e; --line: #dcd9d0; --accent: #1f5fae;
          --rec: #c0392b; --ok: #2e7d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171716; --card: #222220; --ink: #ecebe6; --soft: #a3a19a; --line: #3a3935; --accent: #7fb0ec;
            --rec: #ef6b5b; --ok: #6fc28f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--soft); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 16px; }
  .label { font-weight: 600; margin: 0 0 8px; }
  audio, video, img { width: 100%; display: block; }
  img { height: auto; border-radius: 6px; }
  .q h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .q h2 .n { color: var(--soft); margin-right: 6px; }
  textarea { width: 100%; min-height: 96px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
             border-radius: 8px; padding: 10px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
           color: var(--ink); cursor: pointer; min-height: 44px; }
  button.rec { border-color: var(--rec); color: var(--rec); }
  button.rec.on { background: var(--rec); color: #fff; }
  .status { color: var(--soft); font-size: 0.9rem; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--rec); }
  .said { margin-top: 12px; display: grid; gap: 10px; }
  .clip { border-top: 1px solid var(--line); padding-top: 10px; }
  .clip .when { color: var(--soft); font-size: 0.85rem; }
  .clip .words { margin: 4px 0 0; white-space: pre-wrap; }
  .clip .words.wait { color: var(--soft); font-style: italic; }
  .text-item { white-space: pre-wrap; margin: 0; }
  #err { display: none; }
  .send-card { border-color: var(--accent); }
  button.send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.send:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<main>
  <h1 id="title">Feedback</h1>
  <p class="lead" id="lead">Everything you type or say here is saved on this computer as you go. You can close this tab any time: when you open it again, it is all still here. When you have said everything, press Send at the bottom.</p>
  <div class="card status bad" id="err"></div>
  <section id="items"></section>
  <section id="questions"></section>
  <section id="send"></section>
</main>
<script>
(() => {
  const $ = (s, el) => (el || document).querySelector(s);
  const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const timers = {};
  const pending = {};
  let manifest = null;
  let voiceOn = false;
  let sent = { state: 'writing', at: null, changed_at: null };

  function showError(msg) { const e = $('#err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }
  function when(iso) { try { return new Date(iso).toLocaleString(); } catch (e) { return iso; } }

  async function getJSON(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(url + ': ' + r.status);
    return r.json();
  }

  function renderItems(items) {
    const box = $('#items');
    for (const it of items) {
      const c = make('div', 'card');
      if (it.label) c.appendChild(make('p', 'label', it.label));
      if (it.kind === 'audio') { const a = make('audio'); a.controls = true; a.preload = 'metadata'; a.src = it.src; c.appendChild(a); }
      else if (it.kind === 'video') { const v = make('video'); v.controls = true; v.preload = 'metadata'; v.playsInline = true; v.src = it.src; c.appendChild(v); }
      else if (it.kind === 'image') { const i = make('img'); i.src = it.src; i.alt = it.label || 'picture'; c.appendChild(i); }
      else c.appendChild(make('p', 'text-item', it.text || ''));
      box.appendChild(c);
    }
  }

  function setStatus(n, text, cls) { const s = $('#st' + n); if (s) { s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : ''); } }

  async function saveText(n) {
    clearTimeout(timers[n]);
    const text = $('#t' + n).value;
    pending[n] = false;
    try {
      const r = await fetch('text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: n, text: text }) });
      if (!r.ok) throw new Error(r.status);
      setStatus(n, 'Saved', 'ok');
      return true;
    } catch (e) {
      pending[n] = true;
      setStatus(n, 'Not saved yet: the page server does not answer. Keep this tab open; it tries again.', 'bad');
      timers[n] = setTimeout(() => saveText(n), 5000);
      return false;
    }
  }

  // Send: the person says they are finished (done.json on the computer); typing after it is a late addition, shown
  // here and to the agent, until they press Send again (ledger:M246)
  function showSent() {
    const b = $('#sendbtn'), s = $('#sendst');
    if (!b || !s) return;
    b.disabled = false;
    if (sent.state === 'sent') { b.textContent = 'Send again'; s.textContent = 'Sent ' + when(sent.at) + '. Thank you. If you add anything, press Send again.'; s.className = 'status ok'; }
    else if (sent.state === 'changed') { b.textContent = 'Send again'; s.textContent = 'You changed something after sending. Press Send again when you are done.'; s.className = 'status'; }
    else { b.textContent = 'Send'; s.textContent = 'Not sent yet.'; s.className = 'status'; }
  }

  function changedAfterSend() {
    if (sent.state === 'sent') { sent.state = 'changed'; showSent(); }
  }

  async function send() {
    const b = $('#sendbtn');
    b.disabled = true;
    $('#sendst').textContent = 'Sending...';
    $('#sendst').className = 'status';
    for (const n of Object.keys(pending)) {
      if (pending[n] && !(await saveText(Number(n)))) {
        $('#sendst').textContent = 'Not sent: an answer could not be saved because the page server does not answer. Try again in a moment.';
        $('#sendst').className = 'status bad';
        b.disabled = false;
        return;
      }
    }
    try {
      const r = await fetch('done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      sent = { state: 'sent', at: j.at, changed_at: null };
      showSent();
    } catch (e) {
      $('#sendst').textContent = 'Not sent: the page server does not answer. Your answers are saved; try Send again in a moment.';
      $('#sendst').className = 'status bad';
      b.disabled = false;
    }
  }

  function renderSend() {
    const c = make('div', 'card send-card');
    c.appendChild(make('p', 'label', 'When you have said everything, press Send.'));
    const row = make('div', 'row');
    const b = make('button', 'send', 'Send'); b.type = 'button'; b.id = 'sendbtn'; b.addEventListener('click', send);
    row.appendChild(b);
    const st = make('span', 'status'); st.id = 'sendst'; row.appendChild(st);
    c.appendChild(row);
    $('#send').appendChild(c);
  }

  function renderClips(n, said) {
    const box = $('#said' + n);
    if (!box) return;
    box.textContent = '';
    for (const c of said || []) {
      const d = make('div', 'clip');
      d.appendChild(make('div', 'when', 'Said ' + when(c.at) + (c.secs ? ', ' + c.secs + ' s' : '')));
      const a = make('audio'); a.controls = true; a.preload = 'none'; a.src = 'voice/' + encodeURIComponent(c.file); d.appendChild(a);
      if (c.state === 'done') d.appendChild(make('p', 'words', c.text || '(no words heard)'));
      else d.appendChild(make('p', 'words wait', 'Writing down your words... (' + (c.state || 'waiting') + ')'));
      box.appendChild(d);
    }
  }

  async function record(n, btn) {
    if (btn.rec) { btn.rec.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) {
      setStatus(n, 'The microphone is blocked in this browser. Allow it from the icon in the address bar, or type your answer instead.', 'bad');
      return;
    }
    const mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4'].find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    const t0 = Date.now();
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(btn.tick);
      btn.rec = null; btn.classList.remove('on'); btn.textContent = 'Record';
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
      setStatus(n, 'Saving your recording...');
      for (let i = 0; i < 6; i++) {
        try {
          const r = await fetch('voice?q=' + n + '&secs=' + secs, { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob });
          if (!r.ok) throw new Error(r.status);
          setStatus(n, 'Recording saved. Your words appear under it when they are written down.', 'ok');
          changedAfterSend();
          refresh();
          return;
        } catch (e) { await new Promise((ok) => setTimeout(ok, 2000)); }
      }
      setStatus(n, 'The recording could not be saved: the page server does not answer.', 'bad');
    };
    rec.start(1000);
    btn.rec = rec; btn.classList.add('on');
    btn.tick = setInterval(() => { btn.textContent = 'Stop (' + Math.round((Date.now() - t0) / 1000) + ' s)'; }, 500);
    btn.textContent = 'Stop';
  }

  function renderQuestions(qs) {
    const box = $('#questions');
    for (const q of qs) {
      const c = make('div', 'card q');
      const h = make('h2'); h.appendChild(make('span', 'n', q.n + '.')); h.appendChild(document.createTextNode(q.text)); c.appendChild(h);
      const t = make('textarea'); t.id = 't' + q.n; t.setAttribute('aria-label', 'Answer ' + q.n); t.placeholder = voiceOn ? 'Type here, or press Record and say it' : 'Type here';
      t.addEventListener('input', () => { pending[q.n] = true; changedAfterSend(); setStatus(q.n, 'Typing...'); clearTimeout(timers[q.n]); timers[q.n] = setTimeout(() => saveText(q.n), 600); });
      t.addEventListener('blur', () => { if (pending[q.n]) saveText(q.n); });
      c.appendChild(t);
      const row = make('div', 'row');
      if (voiceOn) { const b = make('button', 'rec', 'Record'); b.type = 'button'; b.addEventListener('click', () => record(q.n, b)); row.appendChild(b); }
      const st = make('span', 'status'); st.id = 'st' + q.n; row.appendChild(st);
      c.appendChild(row);
      const said = make('div', 'said'); said.id = 'said' + q.n; c.appendChild(said);
      box.appendChild(c);
    }
  }

  let polling = null;
  async function refresh(first) {
    let st;
    try { st = await getJSON('state'); showError(''); }
    catch (e) { showError('The page server does not answer right now. What you already saved is safe on the computer.'); return; }
    if (first && st.sent) { sent = st.sent; showSent(); }
    let waiting = 0;
    for (const q of manifest.questions) {
      const a = st.answers[String(q.n)] || {};
      const t = $('#t' + q.n);
      if (first && t && !pending[q.n]) { t.value = a.text || ''; if (a.typed_at) setStatus(q.n, 'Saved ' + when(a.typed_at), 'ok'); }
      renderClips(q.n, a.said);
      waiting += (a.said || []).filter((c) => c.state !== 'done').length;
    }
    clearTimeout(polling);
    if (waiting) polling = setTimeout(() => refresh(false), 4000);
  }

  window.addEventListener('beforeunload', () => {
    for (const n of Object.keys(pending)) {
      if (!pending[n]) continue;
      const body = new Blob([JSON.stringify({ q: Number(n), text: $('#t' + n).value })], { type: 'application/json' });
      navigator.sendBeacon('text', body);
    }
  });

  (async () => {
    try { manifest = await getJSON('manifest'); }
    catch (e) { showError('This page could not load its questions: the page server does not answer.'); return; }
    voiceOn = !!manifest.voice;
    document.title = manifest.title || 'Feedback';
    $('#title').textContent = manifest.title || 'Feedback';
    if (!voiceOn) $('#lead').textContent = 'Everything you type here is saved on this computer as you go. You can close this tab any time: when you open it again, it is all still here. When you have said everything, press Send at the bottom.';
    renderItems(manifest.items || []);
    renderQuestions(manifest.questions || []);
    renderSend();
    showSent();
    await refresh(true);
  })();
})();
</script>
</body>
</html>
