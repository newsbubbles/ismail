name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    # a healthy run takes 5 to 11 minutes; fail a stuck one instead of waiting the 6-hour default
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: speech and mp3 tools (Linux)
        if: runner.os == 'Linux'
        # the Azure apt mirror sometimes stalls (an hour on 2026-10-07): give up on a stalled
        # download after 30 s and retry it, and skip recommended packages we do not need
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends espeak-ng ffmpeg libsndfile1
      - name: install
        run: pip install -e ".[dev]"
      - name: tests
        run: python -m pytest tests -q

  package:
    # what users get: the built wheel in a clean venv, and the Docker image, each answering over MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: pip install build && python -m build
      - name: wheel in a clean venv
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/ismail ops | head -3
          /tmp/v/bin/python $GITHUB_WORKSPACE/.github/scripts/mcp_handshake.py 80 /tmp/v/bin/ismail mcp
      - name: docker image
        run: |
          docker build -t ismail .
          python .github/scripts/mcp_handshake.py 80 docker run -i --rm ismail
