name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    # a healthy run takes 5 to 11 minutes; fail a stuck one instead of waiting the 6-hour default
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: speech and mp3 tools (Linux)
        if: runner.os == 'Linux'
        # the Azure apt mirror sometimes stalls (an hour on 2026-10-07; 10 min three times on 2026-10-26/27,
        # ledger:M360): give up on a stalled download after 30 s, cap each attempt, and on a stall switch to the
        # main Ubuntu mirror and try again; skip recommended packages we do not need
        timeout-minutes: 20
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            if timeout 240 sudo apt-get $APT update &&                timeout 300 sudo apt-get $APT install -y --no-install-recommends espeak-ng ffmpeg libsndfile1; then
              exit 0
            fi
            echo "apt attempt $i stalled or failed: switching to archive.ubuntu.com and trying again"
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g'               /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          done
          exit 1
      - name: install
        run: pip install -e ".[dev]"
      - name: WORLD for autotune (optional; its tests skip without it)
        continue-on-error: true
        run: pip install "pyworld>=0.3.4"
      - name: tests
        run: python -m pytest tests -q

  package:
    # what users get: the built wheel in a clean venv, and the Docker image, each answering over MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: build
        run: pip install build && python -m build
      - name: wheel in a clean venv
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/ismail ops | head -3
          env -u ISMAIL_SONGS /tmp/v/bin/python $GITHUB_WORKSPACE/.github/scripts/wheel_check.py
          /tmp/v/bin/python $GITHUB_WORKSPACE/.github/scripts/mcp_handshake.py 80 /tmp/v/bin/ismail mcp
      - name: docker image
        run: |
          docker build -t ismail .
          python .github/scripts/mcp_handshake.py 80 docker run -i --rm ismail
