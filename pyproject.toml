[project]
name = "ismail"
version = "0.3.0"
description = "A DAW for AI agents: write music as text, read the audio back as text, and play it live. MCP server, CLI and an agent skill."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nate Codes (newsbubbles)"}]
keywords = ["daw", "music", "mcp", "mcp-server", "ai-agents", "agent-skills", "claude-code", "synthesizer",
            "audio-analysis", "live-coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "numba>=0.60",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "matplotlib>=3.8",
    "fastmcp>=2.0",
    "psutil>=5.9",
    "threadpoolctl>=3.1",
    "mutagen>=1.45",
]

[project.optional-dependencies]
perceptual = ["torch>=2.2", "transformers>=4.40"]
separate = ["demucs>=4.0"]
video = ["opencv-python>=4.8", "pycollada>=0.8", "pillow>=10.0"]
live = ["sounddevice>=0.4"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://newsbubbles.github.io/ismail/"
Repository = "https://github.com/newsbubbles/ismail"
Changelog = "https://github.com/newsbubbles/ismail/blob/main/CHANGELOG.md"

[project.scripts]
ismail = "ismail.__main__:cli"
ismail-mcp = "ismail.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ismail", "ismail.live", "ismail.voices", "ismail.voices.keys", "ismail.voices.bass", "ismail.voices.fx",
            "ismail.voices.strings", "ismail.voices.winds", "ismail.voices.brass", "ismail.voices.guitar", "ismail.voices.drums", "ismail.video", "ismail.video.blender",
            "ismail.stage", "ismail.stage.bridge", "ismail.phone", "ismail.exampage"]

[tool.setuptools.package-data]
"ismail.voices" = ["*.json"]
"ismail.voices.keys" = ["*.json"]
"ismail.voices.strings" = ["*.json"]
"ismail.voices.winds" = ["*.json"]
"ismail.voices.brass" = ["*.json"]
"ismail.video" = ["templates/*", "templates/*/*"]
"ismail.exampage" = ["*.html"]
"ismail.phone" = ["page/*.js", "page/*.html", "page/*.svg", "page/*.webmanifest", "page/cues/*.mp3", "page/*.png"]
"ismail.stage" = ["page/*.js", "page/*.html", "page/*.mjs", "page/sounds/*.wav", "page/vendor/three/LICENSE",
                  "page/vendor/three/build/*", "page/vendor/three/examples/jsm/**/*"]
